<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - NewtonBotics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 1rem;
        }

        .subtitle {
            color: #cccccc;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .response-time {
            color: #888888;
            font-size: 0.9rem;
        }

        .contact-form {
            background: #1a1a1a;
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid #333333;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ffffff;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #444444;
            border-radius: 6px;
            background: #2a2a2a;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ff4444;
            box-shadow: 0 0 0 3px rgba(255, 68, 68, 0.1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .char-counter {
            text-align: right;
            color: #888888;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #ff4444;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background: #ff2222;
        }

        .submit-btn:disabled {
            background: #666666;
            cursor: not-allowed;
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.success {
            background: #065f46;
            color: #d1fae5;
            border: 1px solid #047857;
        }

        .alert.error {
            background: #991b1b;
            color: #fecaca;
            border: 1px solid #dc2626;
        }

        .loading {
            display: none;
            text-align: center;
            color: #888888;
            margin-top: 1rem;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #444444;
            border-radius: 50%;
            border-top-color: #ff4444;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 2rem;
        }

        .back-link a {
            color: #ff4444;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🤖 NewtonBotics</div>
            <div class="subtitle">Get In Touch</div>
            <div class="response-time">We typically respond within 24-48 hours</div>
        </div>

        <form class="contact-form" id="contactForm">
            <div class="alert success" id="successAlert">
                Your message has been sent successfully! We'll get back to you soon.
            </div>

            <div class="alert error" id="errorAlert">
                There was an error sending your message. Please try again.
            </div>

            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="subject">Subject *</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="General">General</option>
                    <option value="Technical">Technical Support</option>
                    <option value="Events">Events</option>
                    <option value="Partnership">Partnership</option>
                    <option value="Membership">Membership</option>
                    <option value="Workshop">Workshop</option>
                    <option value="Project">Project</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone (optional)</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="message">Message *</label>
                <textarea id="message" name="message" maxlength="1000" required></textarea>
                <div class="char-counter">
                    <span id="charCount">0</span>/1000
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Send Message
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div>Sending your message...</div>
            </div>
        </form>

        <div class="back-link">
            <a href="/">← Back to API Documentation</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const messageTextarea = document.getElementById('message');
        const charCount = document.getElementById('charCount');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');

        // Character counter
        messageTextarea.addEventListener('input', function() {
            const count = this.value.length;
            charCount.textContent = count;
            
            if (count > 900) {
                charCount.style.color = '#ff4444';
            } else if (count > 800) {
                charCount.style.color = '#ffaa00';
            } else {
                charCount.style.color = '#888888';
            }
        });

        // Form submission
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Hide previous alerts
            successAlert.style.display = 'none';
            errorAlert.style.display = 'none';
            
            // Show loading state
            submitBtn.disabled = true;
            loading.style.display = 'block';
            
            // Collect form data
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            try {
                const response = await fetch('/api/contact/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Show success message
                    successAlert.style.display = 'block';
                    form.reset();
                    charCount.textContent = '0';
                    
                    // Scroll to top to show success message
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    // Show error message
                    errorAlert.textContent = result.error || 'Failed to send message. Please try again.';
                    errorAlert.style.display = 'block';
                    
                    // Scroll to top to show error message
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            } catch (error) {
                console.error('Error:', error);
                errorAlert.textContent = 'Network error. Please check your connection and try again.';
                errorAlert.style.display = 'block';
                
                // Scroll to top to show error message
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } finally {
                // Hide loading state
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Form validation
        const requiredFields = form.querySelectorAll('[required]');
        requiredFields.forEach(field => {
            field.addEventListener('blur', function() {
                if (!this.value.trim()) {
                    this.style.borderColor = '#ff4444';
                } else {
                    this.style.borderColor = '#444444';
                }
            });
            
            field.addEventListener('input', function() {
                if (this.value.trim()) {
                    this.style.borderColor = '#444444';
                }
            });
        });
    </script>
</body>
</html>
